name: maintenance
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: maintenance
  cancel-in-progress: false
jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Regenerate sitemap and robots
        run: |
          python3 - <<'PY'
          import os, subprocess, datetime
          base = "https://tenohira-tools.github.io/"
          urls = []
          for root, _, files in os.walk("docs"):
              if "index.html" in files:
                  rel = os.path.relpath(root, "docs")
                  path = "" if rel == "." else rel.replace(os.sep, "/") + "/"
                  html = open(os.path.join(root, "index.html"), encoding="utf-8").read()
                  if 'name="robots" content="noindex' in html:
                      continue
                  ts = subprocess.run(["git", "log", "-1", "--format=%cs", "--", os.path.join(root, "index.html")],
                                      capture_output=True, text=True).stdout.strip() or datetime.date.today().isoformat()
                  urls.append((base + path, ts))
          urls.sort()
          body = "\n".join(f"  <url><loc>{u}</loc><lastmod>{t}</lastmod></url>" for u, t in urls)
          open("docs/sitemap.xml", "w").write(
              '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
              + body + "\n</urlset>\n")
          open("docs/robots.txt", "w").write("User-agent: *\nAllow: /\nSitemap: " + base + "sitemap.xml\n")
          PY
      - name: Commit if changed
        run: |
          git config user.name "tenohira-tools"
          git config user.email "tenohira-tools@users.noreply.github.com"
          git add docs/sitemap.xml docs/robots.txt
          git diff --cached --quiet || (git commit -m "chore: update sitemap" && git push)
      - name: Notify IndexNow about changed pages
        if: github.event_name == 'push'
        run: |
          KEY=$(ls docs | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          if [ -z "$KEY" ]; then echo "no IndexNow key file; skip"; exit 0; fi
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'docs/*index.html' 2>/dev/null | sed -e 's#^docs/##' -e 's#index.html$##' -e 's#^#https://tenohira-tools.github.io/#')
          [ -z "$CHANGED" ] && { echo "no page changes"; exit 0; }
          LIST=$(printf '%s\n' $CHANGED | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          curl -sS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"tenohira-tools.github.io\",\"key\":\"$KEY\",\"keyLocation\":\"https://tenohira-tools.github.io/$KEY.txt\",\"urlList\":$LIST}" -w "\nHTTP %{http_code}\n"
      - name: Health check (daily)
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          import re, urllib.request, datetime
          urls = re.findall(r"<loc>(.*?)</loc>", open("docs/sitemap.xml").read())
          bad = []
          for u in urls:
              try:
                  code = urllib.request.urlopen(u, timeout=20).status
              except Exception as e:
                  code = str(e)
              if code != 200:
                  bad.append(f"{u} -> {code}")
          line = f"- {datetime.date.today()}: {len(urls)} pages checked, {len(bad)} problems" + ("".join("\n  - " + b for b in bad))
          path = "state/health.md"
          try:
              old = open(path).read()
          except FileNotFoundError:
              old = "# サイトの自動チェック（GitHub Actions）\n\n"
          open(path, "w").write(old + line + "\n")
          PY
          git config user.name "tenohira-tools"
          git config user.email "tenohira-tools@users.noreply.github.com"
          git add state/health.md
          git diff --cached --quiet || (git commit -m "chore: daily health check" && git push)
